data_flow:
  - step: scrape_companies_data
    worker: WebWorker
    output: companies.txt

  - step: load_symbols
    owner: main.py
    input: companies.txt
    output: symbol_queue

  - step: fetch_price
    worker: YahooFinanceWorkerScheduler
    input_queue: symbol_queue
    output_queue: postgres_queue
    output_records:
      symbol: string
      price: decimal|null
      extracted_time: datetime

  - step: store_price
    worker: PostgresWorkerSchedular
    input_queue: postgres_queue
    database_table: prices

shutdown:
  symbol_queue:
    keyword: "DONE"
    sent_by: main.py
    count: thread_count

  postgres_queue:
    keyword: "DONE"
    sent_by: main.py
    count: thread_count
    after: YahooFinanceWorkerScheduler threads finish

settings:
  thread_count: 5  